name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: PHPCS Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPCS
        run: composer run phpcs

  build:
    name: Build ZIP
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build ZIP
        run: ./build-zip.sh

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: aeo-content-ai-studio.zip
          if-no-files-found: error

  release_asset:
    name: Upload ZIP to GitHub Release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' }}
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-zip

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          files: aeo-content-ai-studio.zip
          overwrite_files: true

  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' }}
    needs: [lint, build, release_asset]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate WordPress.org Secrets
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          if [ -z "$SVN_USERNAME" ] || [ -z "$SVN_PASSWORD" ]; then
            echo "::error::Missing SVN_USERNAME or SVN_PASSWORD GitHub Actions secrets."
            exit 1
          fi

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: aeo-content-ai-studio
